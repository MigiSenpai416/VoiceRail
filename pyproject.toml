[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "voicerail"
version = "0.1.0"
description = "Train RVC voice models from raw recordings and convert songs or speech to any voice, from a friendly web UI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "soundfile>=0.12.1",
  "soxr>=0.5",
  "librosa>=0.10.2",
  # librosa>=1.0 no longer pulls audioread, but audio-separator imports it.
  "audioread>=3.0",
  "pyloudnorm>=0.1.1",
  "faiss-cpu>=1.8",
  "audio-separator[cpu]>=0.40",
  "imageio-ffmpeg>=0.5",
  "pedalboard>=0.9.12",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "requests>=2.31",
  "tqdm>=4.66",
]

[project.optional-dependencies]
# Pick exactly one of the torch variants below. torchvision is listed so it
# comes from the same index as torch (audio-separator needs it, and a
# mismatched PyPI build fails to import).
# cuda: NVIDIA driver >= 580 (all GPUs incl. RTX 50xx); cuda-legacy: >= 525.
# On Linux the CUDA runtime comes as ~5 GB of separate NVIDIA wheels that
# torch depends on. They are listed here only so that [tool.uv.sources] can
# fetch them from the PyTorch index, whose CDN is far faster than PyPI's in
# many places. The pins are exactly what the locked torch requires; bump them
# together with torch (uv reports a conflict otherwise).
cuda = [
  "torch>=2.6 ; sys_platform != 'darwin'",
  "torchvision ; sys_platform != 'darwin'",
  "nvidia-cublas==13.1.1.3 ; sys_platform == 'linux'",
  "nvidia-cuda-cupti==13.0.85 ; sys_platform == 'linux'",
  "nvidia-cuda-nvrtc==13.0.88 ; sys_platform == 'linux'",
  "nvidia-cuda-runtime==13.0.96 ; sys_platform == 'linux'",
  "nvidia-cudnn-cu13==9.24.0.43 ; sys_platform == 'linux'",
  "nvidia-cufft==12.0.0.61 ; sys_platform == 'linux'",
  "nvidia-cufile==1.15.1.6 ; sys_platform == 'linux'",
  "nvidia-curand==10.4.0.35 ; sys_platform == 'linux'",
  "nvidia-cusolver==12.0.4.66 ; sys_platform == 'linux'",
  "nvidia-cusparse==12.6.3.3 ; sys_platform == 'linux'",
  "nvidia-cusparselt-cu13==0.8.1 ; sys_platform == 'linux'",
  "nvidia-nccl-cu13==2.30.7 ; sys_platform == 'linux'",
  "nvidia-nvshmem-cu13==3.4.5 ; sys_platform == 'linux'",
  "nvidia-nvtx==13.0.85 ; sys_platform == 'linux'",
]
cuda-legacy = [
  "torch>=2.6 ; sys_platform != 'darwin'",
  "torchvision ; sys_platform != 'darwin'",
  "nvidia-cublas-cu12==12.6.4.1 ; sys_platform == 'linux'",
  "nvidia-cuda-cupti-cu12==12.6.80 ; sys_platform == 'linux'",
  "nvidia-cuda-nvrtc-cu12==12.6.85 ; sys_platform == 'linux'",
  "nvidia-cuda-runtime-cu12==12.6.77 ; sys_platform == 'linux'",
  "nvidia-cudnn-cu12==9.10.2.21 ; sys_platform == 'linux'",
  "nvidia-cufft-cu12==11.3.0.4 ; sys_platform == 'linux'",
  "nvidia-cufile-cu12==1.11.1.6 ; sys_platform == 'linux'",
  "nvidia-curand-cu12==10.3.7.77 ; sys_platform == 'linux'",
  "nvidia-cusolver-cu12==11.7.1.2 ; sys_platform == 'linux'",
  "nvidia-cusparse-cu12==12.5.4.2 ; sys_platform == 'linux'",
  "nvidia-cusparselt-cu12==0.7.1 ; sys_platform == 'linux'",
  "nvidia-nccl-cu12==2.29.3 ; sys_platform == 'linux'",
  "nvidia-nvjitlink-cu12==12.9.86 ; sys_platform == 'linux'",
  "nvidia-nvshmem-cu12==3.4.5 ; sys_platform == 'linux'",
  "nvidia-nvtx-cu12==12.6.77 ; sys_platform == 'linux'",
]
rocm = [
  "torch>=2.6 ; sys_platform == 'linux'",
  "torchvision ; sys_platform == 'linux'",
  "triton-rocm ; sys_platform == 'linux'",
]
cpu = ["torch>=2.6", "torchvision"]

[project.scripts]
voicerail = "voicerail.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/voicerail"]

[tool.uv]
environments = [
  "sys_platform == 'win32'",
  "sys_platform == 'linux'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
conflicts = [
  [{ extra = "cuda" }, { extra = "cuda-legacy" }, { extra = "rocm" }, { extra = "cpu" }],
]
# diffq is only used by audio-separator's Demucs models, which VoiceRail does
# not use, and it has no wheels for modern Python (it would need a compiler).
override-dependencies = [
  "diffq ; sys_platform == 'never'",
  "diffq-fixed ; sys_platform == 'never'",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", extra = "cuda" },
  { index = "pytorch-cu126", extra = "cuda-legacy" },
  { index = "pytorch-rocm", extra = "rocm" },
  { index = "pytorch-cpu", extra = "cpu" },
]
torchvision = [
  { index = "pytorch-cu130", extra = "cuda" },
  { index = "pytorch-cu126", extra = "cuda-legacy" },
  { index = "pytorch-rocm", extra = "rocm" },
  { index = "pytorch-cpu", extra = "cpu" },
]
triton-rocm = [{ index = "pytorch-rocm", extra = "rocm" }]
# The NVIDIA runtime wheels of each CUDA variant (see the extras above).
nvidia-cublas-cu12 = [{ index = "pytorch-cu126", extra = "cuda-legacy" }]
nvidia-cuda-cupti-cu12 = [{ index = "pytorch-cu126", extra = "cuda-legacy" }]
nvidia-cuda-nvrtc-cu12 = [{ index = "pytorch-cu126", extra = "cuda-legacy" }]
nvidia-cuda-runtime-cu12 = [{ index = "pytorch-cu126", extra = "cuda-legacy" }]
nvidia-cudnn-cu12 = [{ index = "pytorch-cu126", extra = "cuda-legacy" }]
nvidia-cufft-cu12 = [{ index = "pytorch-cu126", extra = "cuda-legacy" }]
nvidia-cufile-cu12 = [{ index = "pytorch-cu126", extra = "cuda-legacy" }]
nvidia-curand-cu12 = [{ index = "pytorch-cu126", extra = "cuda-legacy" }]
nvidia-cusolver-cu12 = [{ index = "pytorch-cu126", extra = "cuda-legacy" }]
nvidia-cusparse-cu12 = [{ index = "pytorch-cu126", extra = "cuda-legacy" }]
nvidia-cusparselt-cu12 = [{ index = "pytorch-cu126", extra = "cuda-legacy" }]
nvidia-nccl-cu12 = [{ index = "pytorch-cu126", extra = "cuda-legacy" }]
nvidia-nvjitlink-cu12 = [{ index = "pytorch-cu126", extra = "cuda-legacy" }]
nvidia-nvshmem-cu12 = [{ index = "pytorch-cu126", extra = "cuda-legacy" }]
nvidia-nvtx-cu12 = [{ index = "pytorch-cu126", extra = "cuda-legacy" }]
nvidia-cublas = [{ index = "pytorch-cu130", extra = "cuda" }]
nvidia-cuda-cupti = [{ index = "pytorch-cu130", extra = "cuda" }]
nvidia-cuda-nvrtc = [{ index = "pytorch-cu130", extra = "cuda" }]
nvidia-cuda-runtime = [{ index = "pytorch-cu130", extra = "cuda" }]
nvidia-cudnn-cu13 = [{ index = "pytorch-cu130", extra = "cuda" }]
nvidia-cufft = [{ index = "pytorch-cu130", extra = "cuda" }]
nvidia-cufile = [{ index = "pytorch-cu130", extra = "cuda" }]
nvidia-curand = [{ index = "pytorch-cu130", extra = "cuda" }]
nvidia-cusolver = [{ index = "pytorch-cu130", extra = "cuda" }]
nvidia-cusparse = [{ index = "pytorch-cu130", extra = "cuda" }]
nvidia-cusparselt-cu13 = [{ index = "pytorch-cu130", extra = "cuda" }]
nvidia-nccl-cu13 = [{ index = "pytorch-cu130", extra = "cuda" }]
nvidia-nvshmem-cu13 = [{ index = "pytorch-cu130", extra = "cuda" }]
nvidia-nvtx = [{ index = "pytorch-cu130", extra = "cuda" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.1"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# gr.Progress() as a default argument is how Gradio injects progress bars.
"src/voicerail/web/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Training tests write ~1 GB of checkpoints; keep temp dirs only on failure.
tmp_path_retention_policy = "failed"
markers = [
  "assets: needs downloaded base models (rmvpe, hubert, pretrains)",
  "slow: long running test",
]
